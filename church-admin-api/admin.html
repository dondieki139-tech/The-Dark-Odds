<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Victory Church Admin</title><style>body{margin:0;background:#f3f5f7;color:#23313d;font:16px Arial}.top{background:#102b46;color:white;padding:18px 5%}.wrap{max-width:950px;margin:30px auto;padding:0 16px}.panel{background:white;padding:22px;border-radius:10px;margin-bottom:20px}h1,h2{color:#102b46}input,button{font:inherit;padding:11px;border:1px solid #ccd5dd;border-radius:5px}input{display:block;width:100%;margin:8px 0 14px;box-sizing:border-box}button{background:#e4b34e;border:0;font-weight:bold;cursor:pointer}.hidden{display:none}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}.photo{border:1px solid #ddd;padding:10px;border-radius:7px}.photo img{width:100%;height:160px;object-fit:cover}.danger{background:#a32f2f;color:white;margin-left:8px}.msg{color:#a32f2f}</style></head><body><header class="top"><b>Victory Church of Kenya — Admin</b></header><main class="wrap"><section id="login" class="panel"><h1>Admin sign in</h1><form id="loginForm"><label>Admin password</label><input id="password" type="password" required autocomplete="current-password"><button>Sign in</button></form><p id="loginMsg" class="msg"></p></section><section id="app" class="hidden"><div class="panel"><h1>Manage website photos</h1><p>Upload new photos, replace existing images, edit captions or delete photos.</p><form id="addForm"><label>Photo title</label><input name="title" required maxlength="160"><label>Description</label><input name="alt_text" maxlength="240"><label>Choose image (JPG, PNG, WEBP or GIF; max 8 MB)</label><input name="photo" type="file" accept="image/jpeg,image/png,image/webp,image/gif" required><button>Upload photo</button></form><p id="addMsg" class="msg"></p></div><div class="panel"><h2>Current photos</h2><div id="photos" class="grid"></div><p id="listMsg" class="msg"></p><button id="logout">Sign out</button></div></section></main><script>
const API='https://victory-church-admin-api.onrender.com';const $=x=>document.querySelector(x);
async function api(path,opt={}){const r=await fetch(API+path,{credentials:'include',...opt});let d={};try{d=await r.json()}catch{}if(!r.ok)throw Error(d.error||'Request failed');return d}
function enter(){ $('#login').classList.add('hidden');$('#app').classList.remove('hidden');load()}
$('#loginForm').onsubmit=async e=>{e.preventDefault();try{await api('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:$('#password').value})});$('#password').value='';enter()}catch(x){$('#loginMsg').textContent=x.message}};
$('#addForm').onsubmit=async e=>{e.preventDefault();$('#addMsg').textContent='Uploading…';try{await api('/api/photos',{method:'POST',body:new FormData(e.target)});e.target.reset();$('#addMsg').textContent='Photo uploaded.';load()}catch(x){$('#addMsg').textContent=x.message}};
$('#logout').onclick=async()=>{try{await api('/api/logout',{method:'POST'})}finally{location.reload()}};
async function load(){const root=$('#photos');root.textContent='Loading…';try{const ps=await api('/api/photos');root.innerHTML='';if(!ps.length){root.textContent='No photos uploaded yet.';return}ps.forEach(p=>{const el=document.createElement('div');el.className='photo';const img=document.createElement('img');img.src=API+p.url;img.alt=p.alt_text||p.title;const title=document.createElement('input');title.value=p.title;title.placeholder='Title';const alt=document.createElement('input');alt.value=p.alt_text;alt.placeholder='Description';const file=document.createElement('input');file.type='file';file.accept='image/jpeg,image/png,image/webp,image/gif';const save=document.createElement('button');save.textContent='Save / Replace';save.onclick=async()=>{const f=new FormData();f.append('title',title.value);f.append('alt_text',alt.value);if(file.files[0])f.append('photo',file.files[0]);try{await api('/api/photos/'+p.id,{method:'PUT',body:f});$('#listMsg').textContent='Saved.';load()}catch(x){$('#listMsg').textContent=x.message}};const del=document.createElement('button');del.textContent='Delete';del.className='danger';del.onclick=async()=>{if(!confirm('Permanently delete this photo?'))return;try{await api('/api/photos/'+p.id,{method:'DELETE'});$('#listMsg').textContent='Deleted.';load()}catch(x){$('#listMsg').textContent=x.message}};el.append(img,title,alt,file,save,del);root.append(el)})}catch(x){root.textContent=x.message}}
</script></body></html>
